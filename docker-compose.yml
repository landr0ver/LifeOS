services:
  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lifeos_dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lifeos:${DB_PASSWORD:-lifeos_dev}@db/lifeos
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-changeme}
      RUST_LOG: info
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      PUBLIC_API_URL: http://backend:3000
    ports:
      - "5173:5173"

volumes:
  pgdata:
